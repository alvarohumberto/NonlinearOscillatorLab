[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "nonlinear-oscillator-lab"
version = "0.1.0"
description = "Energy-based classification and reproducible simulation of polynomial conservative oscillators"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Alvaro H. Salas"}]
dependencies = ["numpy>=1.23", "scipy>=1.10"]
[project.optional-dependencies]
test = ["pytest>=7"]
[tool.setuptools.packages.find]
where = ["src"]
